<!doctype html>
<html lang="{{?LANG}}" class="export {{?FORMAT_CLASS}}">
<head>
  <meta charset="utf-8">
  <title>{{BRAND_NAME}}</title>
  <style>
    /* Par de fontes do veículo (src/lib/tipografia.ts): Corpo = texto; Destaque = nome do veículo e título do convite. */
    @font-face { font-family: Corpo; src: url(data:font/woff2;base64,{{FONT_BODY}}) format('woff2'); font-weight: {{?FONT_BODY_WEIGHT}}; font-display: block; }
    @font-face { font-family: Destaque; src: url(data:font/woff2;base64,{{FONT_DISPLAY}}) format('woff2'); font-weight: {{?FONT_DISPLAY_WEIGHT}}; font-display: block; }
    :root { color-scheme: light; --bg: {{COLOR_BG}}; --ink: {{COLOR_INK}}; --accent: {{COLOR_ACCENT}}; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; font-family: Corpo, sans-serif; }
    .card { position: relative; width: 1080px; height: 1350px; background: var(--bg); color: var(--ink); overflow: hidden; }
    .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: {{ART_POSITION}}% {{ART_POSITION_Y}}%; }
    .art-flat { background: radial-gradient(120% 90% at 20% 10%, var(--accent) 0%, var(--bg) 60%); }
    .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.35) 18%, rgba(0,0,0,0) 32%, rgba(0,0,0,0) 49%, rgba(0,0,0,.18) 60%, rgba(0,0,0,.72) 77%, rgba(0,0,0,.92) 100%); }
    header { position: absolute; top: 70px; left: 68px; right: 68px; display: flex; justify-content: space-between; align-items: flex-start; gap: 30px; }
    .brand { line-height: 0; }
    .brand-mark { display: block; max-width: 220px; height: 100px; object-fit: contain; object-position: left; }
    .brand-name { font: 900 34px/1 Destaque, sans-serif; letter-spacing: -1px; }
    .archive { text-align: right; font-size: 24px; line-height: 1.4; margin: 0; font-weight: 700; }
    .archive strong { display: block; font-weight: 900; font-size: 23px; letter-spacing: 2px; text-transform: uppercase; }
    .story { position: absolute; left: 68px; right: 68px; bottom: 126px; }
    .location { margin: 0 0 20px; font-size: 27px; line-height: 1.35; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 0; font: 900 58px/1.07 Corpo, sans-serif; letter-spacing: -.5px; text-transform: uppercase; text-wrap: pretty; }
    .story-body { font-size: 34px; line-height: 1.4; margin: 22px 0 0; }
    .story-body:empty, .location:empty { display: none; }
    .titulo-destaque h1 { font-family: Destaque, serif; }
    .detail h1 { font-size: 47px; line-height: 1.1; }
    .context .story-body { font-size: 34px; text-transform: uppercase; font-weight: 800; }
    /* Layouts da Fase 3 (src/lib/cards.ts): citação, número em destaque, lista. */
    .quote .story { display: flex; flex-direction: column; }
    .quote .location { order: 0; }
    .quote .story-body { order: 1; margin: 0; font-size: 46px; line-height: 1.28; font-weight: 800; }
    .quote .story-body::before { content: '\201C'; display: block; font: 900 150px/0.7 Destaque, serif; color: var(--accent); margin-bottom: 6px; }
    .quote h1 { order: 2; margin-top: 30px; font-size: 32px; line-height: 1.25; letter-spacing: 1px; color: var(--accent); }
    .stat h1 { font-size: 190px; line-height: .95; letter-spacing: -4px; color: var(--accent); }
    .stat .story-body { font-size: 38px; line-height: 1.32; margin-top: 26px; font-weight: 700; }
    .list h1 { font-size: 47px; line-height: 1.1; }
    .story-list { list-style: none; margin: 22px 0 0; padding: 0; counter-reset: item; }
    .story-list li { counter-increment: item; display: flex; gap: 22px; padding: 16px 0; border-top: 2px solid color-mix(in srgb, var(--ink) 30%, transparent); font-size: 31px; line-height: 1.3; font-weight: 700; }
    .story-list li::before { content: counter(item, decimal-leading-zero); flex: none; color: var(--accent); font-weight: 900; }
    .photo .shade { background: linear-gradient(180deg, rgba(0,0,0,.6) 0%, rgba(0,0,0,.2) 22%, rgba(0,0,0,0) 40%, rgba(0,0,0,.3) 58%, rgba(0,0,0,.82) 78%, rgba(0,0,0,.94) 100%); }
    .promo .shade { background: linear-gradient(180deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.85) 40%, rgba(0,0,0,.35) 64%, rgba(0,0,0,.92) 100%); }
    .promo .story { top: 238px; bottom: auto; }
    .promo .archive { display: none; }
    .promo h1 { font: 700 96px/1.08 Destaque, sans-serif; text-transform: none; letter-spacing: -3px; max-width: 890px; color: var(--accent); }
    .promo .story-body { font-size: 36px; max-width: 760px; }
    footer { position: absolute; left: 68px; right: 68px; bottom: 53px; display: flex; justify-content: space-between; align-items: center; gap: 24px; font-size: 23px; line-height: 1.35; opacity: .9; }
    footer p { margin: 0; }
    footer a { color: inherit; text-decoration: none; }
    .domain { font-weight: 800; white-space: nowrap; }
    .marca-dagua { position: absolute; pointer-events: none; line-height: 0; }
    .marca-dagua img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .marca-dagua span { display: block; font: 900 32px/1 Destaque, sans-serif; letter-spacing: -.5px; white-space: nowrap; }
    .marca-dagua.canto { top: 210px; right: 68px; height: 76px; max-width: 520px; }
    .marca-dagua.canto img { width: auto; max-width: 220px; }
    .marca-dagua.canto span { line-height: 76px; }
    .marca-dagua.rodape { left: 0; right: 0; bottom: 12px; height: 30px; display: flex; justify-content: center; }
    .marca-dagua.rodape img { width: auto; }
    .marca-dagua.rodape span { font-size: 22px; line-height: 30px; }
    .promo .marca-dagua { display: none; }
    /* Reels (9:16, src/lib/reels.ts): o mesmo card, mais alto. Topo e pé ficam fora da área que a interface do Reels
       cobre (nome do perfil em cima; legenda e botões embaixo e à direita). */
    .r916 .card { height: 1920px; }
    .r916 header { top: 200px; }
    .r916 .story { bottom: 420px; right: 150px; }
    .r916 .promo .story { top: 400px; bottom: auto; }
    .r916 footer { bottom: 300px; right: 150px; }
    .r916 .marca-dagua.canto { top: 340px; }
    .r916 .marca-dagua.rodape { bottom: 250px; }
  {{?ESTILO_CSS}}</style>
</head>
<body>
  <article class="card {{SLIDE_CLASS}}" aria-labelledby="headline">
    {{ART_TAG}}
    <div class="shade" aria-hidden="true"></div>
    <header data-fit>
      <div class="brand">{{BRAND_TAG}}</div>
      <p class="archive"><strong>{{DATE_LABEL}}</strong>{{DATE_VALUE}}</p>
    </header>
    <div class="story" data-fit>
      <p class="location">{{EYEBROW}}</p>
      <h1 id="headline">{{HEADLINE}}</h1>
      <p class="story-body">{{BODY_TEXT}}</p>
      {{?LIST_TAG}}
    </div>
    <footer data-fit>
      <p>{{FOOTER_LABEL}} <a href="{{SOURCE_URL}}">{{SOURCE_NAME}}</a></p>
      <a class="domain" href="{{CTA_URL}}">{{DOMAIN}}</a>
    </footer>
    {{WATERMARK}}{{?SELO_TAG}}{{?SPONSOR_TAG}}
  </article>
</body>
</html>
