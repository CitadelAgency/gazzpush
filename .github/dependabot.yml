version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router"]
      tiptap:
        patterns: ["@tiptap/*"]
  - package-ecosystem: npm
    directory: /container/reels
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
